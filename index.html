<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小提琴聆听计划</title>
<meta name="theme-color" content="#f4f0e8">
<meta name="description" content="每天一个具体的聆听观察，按自己的速度认识小提琴演奏家。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#f4f0e8; --paper:rgba(255,253,248,.91); --ink:#39352f;
  --muted:#7e776e; --line:#ddd5ca; --rose:#caa8a5; --sage:#aab9a3;
  --blue:#aabac7; --lav:#b8adc4; --gold:#c8ad79; --accent:#826c65;
  --shadow:0 16px 40px rgba(83,70,58,.08)
}
*{box-sizing:border-box}
body{
  margin:0;color:var(--ink);line-height:1.75;
  font-family:"Noto Serif SC","Songti SC","STSong",Georgia,serif;
  background:
    radial-gradient(circle at 8% 8%,rgba(202,168,165,.22),transparent 25%),
    radial-gradient(circle at 92% 15%,rgba(170,185,163,.22),transparent 25%),
    linear-gradient(180deg,#f8f5ef 0%,#f1ede5 100%);
  min-height:100vh
}
header{
  position:relative;overflow:hidden;padding:58px 20px 40px;text-align:center;
  border-bottom:1px solid rgba(221,213,202,.8);
  background:rgba(255,253,248,.72);backdrop-filter:blur(8px)
}
header:before{
  content:"𝄞";position:absolute;left:7%;top:-35px;font-family:Georgia,serif;
  font-size:180px;color:rgba(184,173,196,.13);transform:rotate(-8deg)
}
header:after{
  content:"♪  ♫  ♩";position:absolute;right:7%;bottom:8px;
  font-size:34px;letter-spacing:16px;color:rgba(130,108,101,.16)
}
.music-line{font-family:Georgia,serif;color:var(--gold);font-size:18px;letter-spacing:.35em;margin-bottom:7px}
header h1{position:relative;margin:0;font-size:clamp(30px,5vw,48px);font-weight:600;letter-spacing:.1em}
header p{position:relative;color:var(--muted);margin:10px 0 0;font-size:15px}
.wrap{max-width:1020px;margin:auto;padding:30px 18px 80px}
.progressbox{margin:0 0 22px;padding:14px 18px;background:rgba(255,255,255,.45);border:1px solid rgba(221,213,202,.75);border-radius:16px}
.progressrow{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px;margin-bottom:8px}
.progressbar{height:7px;background:#e9e3da;border-radius:99px;overflow:hidden}
.progressfill{height:100%;width:0;background:linear-gradient(90deg,var(--sage),var(--rose),var(--lav));border-radius:99px;transition:width .35s}
.weeknav{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:22px}
button{
  font:inherit;border:1px solid var(--line);background:rgba(255,253,248,.78);
  padding:9px 14px;border-radius:999px;cursor:pointer;color:var(--ink);
  transition:.2s ease
}
button:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(83,70,58,.08)}
button.active{background:#756861;color:#fff;border-color:#756861}
.hero,.card{
  background:var(--paper);border:1px solid rgba(221,213,202,.9);
  border-radius:24px;box-shadow:var(--shadow)
}
.hero{position:relative;overflow:hidden;padding:30px 32px;margin-bottom:18px}
.hero:after{content:"♬";position:absolute;right:28px;top:12px;font:72px Georgia,serif;color:rgba(202,168,165,.13)}
.hero small,.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.1em}
.hero h2{font-size:32px;margin:4px 0}.hero p{max-width:760px;margin:5px 0;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:18px 0}
.daybtn{border-radius:14px;padding:11px 6px;background:rgba(255,253,248,.78)}
.daybtn:nth-child(1){border-bottom:3px solid var(--rose)}
.daybtn:nth-child(2){border-bottom:3px solid var(--sage)}
.daybtn:nth-child(3){border-bottom:3px solid var(--blue)}
.daybtn:nth-child(4){border-bottom:3px solid var(--lav)}
.daybtn:nth-child(5){border-bottom:3px solid var(--gold)}
.card{padding:30px 32px;position:relative}
.card:before{content:"";display:block;width:54px;height:3px;border-radius:10px;background:linear-gradient(90deg,var(--rose),var(--gold));margin-bottom:18px}
.card h3{font-size:27px;margin:4px 0 8px;line-height:1.35}
.piece{font-size:18px;font-weight:700;margin:18px 0 2px}
.piece:before{content:"♫";color:var(--rose);margin-right:9px}
.meta{color:var(--muted);margin:0 0 18px}
.observe{margin:18px 0;padding-left:24px}
.observe li{margin:10px 0;padding-left:4px}
.practice{margin-top:24px;padding:18px 20px;border:1px solid #e5ddd2;border-radius:16px;background:linear-gradient(135deg,rgba(170,185,163,.12),rgba(255,253,248,.7))}
.practice strong:before{content:"♩";color:var(--sage);font-size:19px;margin-right:8px}
.quote{margin:22px 0 0;padding:16px 20px;border-left:4px solid var(--rose);border-radius:0 12px 12px 0;background:rgba(202,168,165,.10);font-weight:700}
.search{display:inline-block;margin-top:17px;color:#77635e;text-decoration:none;border-bottom:1px solid #cdbab5}
.actionrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.primary{background:#756861!important;color:white!important;border-color:#756861!important}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:34px}
footer:before{content:"𝄞";display:block;font:26px Georgia,serif;color:rgba(130,108,101,.35);margin-bottom:4px}
@media(max-width:650px){
 header{padding:44px 18px 30px}.wrap{padding:22px 12px 60px}
 .days{grid-template-columns:repeat(5,1fr);gap:5px}.daybtn{padding:9px 2px;font-size:12px}
 .hero,.card{padding:22px 20px;border-radius:20px}.hero h2{font-size:27px}
 .card h3{font-size:23px}.weeknav{gap:6px}.weeknav button{font-size:12px;padding:7px 10px}
}

.statusbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px;font-size:13px;color:var(--muted)}
.statusbar button{padding:5px 11px;font-size:12px}
.notes{margin-top:20px}.notes textarea{display:block;width:100%;min-height:86px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fffdf8;color:var(--ink);font:inherit;resize:vertical}
.notice{padding:10px 14px;margin-bottom:16px;border:1px solid var(--line);border-radius:12px;background:#fffdf8}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="music-line">♪ ♩ ♫</div><h1>小提琴聆听计划</h1><p>每周一位演奏家 · 每天一个可以真正听见的重点</p></header>
<main class="wrap">
  <section class="progressbox">
  <div class="progressrow"><span>聆听旅程</span><span id="progressText"></span></div>
  <div class="progressbar"><div class="progressfill" id="progressFill"></div></div>
</section>
<div class="statusbar"><span id="contentStatus">正在读取课程…</span><button id="refreshContent" type="button">检查新课程</button></div>
<div id="updateNotice" class="notice" hidden></div>
<nav class="weeknav" id="weeknav"></nav>
  <section class="hero">
    <small id="weekLabel"></small><h2 id="artist"></h2><p id="intro"></p>
  </section>
  <div class="days" id="days"></div>
  <article class="card">
    <div class="eyebrow" id="daylabel"></div>
    <h3 id="focus"></h3>
    <div class="piece" id="piece"></div>
    <p class="meta" id="segment"></p>
    <ol class="observe" id="observe"></ol>
    <section class="practice"><strong>30秒练琴实验</strong><div id="practice"></div></section>
    <div class="quote" id="quote"></div>
    <a class="search" id="search" target="_blank" rel="noopener">在 YouTube 搜索这个版本 →</a>
    <section class="notes"><label for="notesInput"><strong>我的聆听笔记（仅保存在这台设备）</strong></label><textarea id="notesInput" placeholder="今天听到了什么？最喜欢哪一句？"></textarea></section>
<div class="actionrow">
      <button class="primary" onclick="completeDay()">完成今天的学习 →</button>
      <button onclick="resetProgress()">从第一课重新开始</button>
    </div>
  </article>
  <footer>不比较神童的学习速度。只比较：我今天比昨天多听见了什么？</footer>
</main>
<script src="app.js" defer></script>
</body></html>
